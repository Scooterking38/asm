name: Compile and Decompile Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install PyGhidra
        run: |
          python -m pip install --upgrade pip
          pip install pyghidra

      - name: Download and Extract Ghidra
        run: |
          GHIDRA_VERSION="12.1.3_PUBLIC"
          GHIDRA_DATE="20250205"
          wget https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_PUBLIC/ghidra_${GHIDRA_VERSION}_${GHIDRA_DATE}.zip
          unzip -q ghidra_${GHIDRA_VERSION}_${GHIDRA_DATE}.zip
          echo "GHIDRA_INSTALL_DIR=$PWD/ghidra_${GHIDRA_VERSION}" >> $GITHUB_ENV

      - name: Compile C Code
        run: |
          # Compile into the binary name expected by your Python script
          gcc main.c -o check_age_bin
          
          # Generate clean Intel-syntax assembly for artifact upload
          gcc -S -masm=intel main.c -o main.s

      - name: Run Decompilation Script
        run: |
          python main.py

      - name: Upload Artifacts (Assembly & Pseudo-C)
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-decompilation-results
          path: |
            main.s
            decompiled_output.c
