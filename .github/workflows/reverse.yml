name: Decompile Assembly

on: [push, workflow_dispatch]

jobs:
  build-and-decompile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install NASM
      run: sudo apt-get update && sudo apt-get install -y nasm

    - name: Compile Assembly to Binary
      run: |
        nasm -f elf64 asm.asm -o asm.o
        ld asm.o -o check_age_bin

    - name: Download and Extract Ghidra
      run: |
        wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
        unzip -q ghidra_12.1.3_PUBLIC_20260817.zip
        GHIDRA_DIR=$(find $PWD -maxdepth 1 -type d -name "ghidra_*_PUBLIC*" | head -n 1)
        echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> $GITHUB_ENV
        echo "Found Ghidra at: $GHIDRA_DIR"

    - name: Install PyGhidra
      run: pip install pyghidra

    - name: Run Decompiler Script
      run: python main.py

    - name: Upload Output C File
      uses: actions/upload-artifact@v4
      with:
        name: decompiled-c-code
        path: decompiled_output.c
