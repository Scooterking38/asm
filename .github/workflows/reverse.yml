name: Decompile C to Pseudo-C

on: [push, workflow_dispatch]

jobs:
  build-and-decompile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile C to Binary and Generate Assembly
      run: |
        # Generate the assembly listing from your C file using GCC
        gcc -S main.c -o generated_assembly.s
        
        # Compile C source code into the binary for Ghidra to analyze
        gcc main.c -o check_age_bin

    - name: Download and Extract Ghidra
      run: |
        wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
        unzip -q ghidra_12.1.3_PUBLIC_20260817.zip
        GHIDRA_DIR=$(find $PWD -maxdepth 1 -type d -name "ghidra_*_PUBLIC*" | head -n 1)
        echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> $GITHUB_ENV
        echo "Found Ghidra at: $GHIDRA_DIR"

    - name: Install PyGhidra
      run: pip install pyghidra

    - name: Run Decompiler Script
      run: python main.py

    - name: Upload Generated Assembly
      uses: actions/upload-artifact@v4
      with:
        name: generated-assembly
        path: generated_assembly.s

    - name: Upload Decompiled Pseudo-C
      uses: actions/upload-artifact@v4
      with:
        name: decompiled-c-code
        path: decompiled_output.c
