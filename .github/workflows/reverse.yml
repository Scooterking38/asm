name: Decompile Assembly to C

on: [push]

jobs:
  decompile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Extract Ghidra
      run: |
        wget https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
        unzip -q ghidra_12.1.3_PUBLIC_20260817.zip
        echo "GHIDRA_INSTALL_DIR=$PWD/ghidra_12.1.3_PUBLIC_20260817" >> $GITHUB_ENV

    - name: Install PyGhidra and Dependencies
      run: |
        pip install pyghidra

    - name: Run Decompiler Script
      run: |
        python ghidra.py > decompiled_output.c

    - name: Upload Output C File
      uses: actions/upload-artifact@v4
      with:
        name: decompiled-c-code
        path: decompiled_output.c
